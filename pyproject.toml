[project]
name = "pama"
version = "0.2.0"
description = "Accs manager"
readme = "README.md"
authors = [
    { name = "xsalagarcia", email = "xsalagarcia@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.39",
]

[project.scripts]
pama = "pama:main"

[project.gui-scripts]
pama_tk = "pama.tkinter_UI.tkinter_main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
